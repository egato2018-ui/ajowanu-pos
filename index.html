    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = typeof originalFetch === 'function' ? originalFetch.bind(window) : originalFetch;

          var fetchDescriptor = {
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          };

          try {
            Object.defineProperty(window, 'fetch', fetchDescriptor);
          } catch (e) {}

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', fetchDescriptor);
            } catch (e) {}
          }

          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            try {
              Object.defineProperty(globalThis, 'fetch', fetchDescriptor);
            } catch (e) {}
          }
        } catch (_) {}
      })();
    </script>
